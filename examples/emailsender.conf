# Copier vers emailsender.conf (ou ~/.config/emailsender.conf) puis : chmod 600 emailsender.conf
server   = smtp.gmail.com
port     = 587
security = auto          # auto | none | starttls | ssl
username = votre-adresse@gmail.com
# Préférez la variable EMAILSENDER_PASSWORD ou --password-file à un mot de passe en clair ici.
# password = mot-de-passe-d-application
from      = Votre Nom <votre-adresse@gmail.com>
timeout   = 60
retries   = 2
delay_ms  = 500          # pause entre deux messages en mode --batch
verify_tls = true
